[project]
name = "quant-lab"
version = "0.1.0"
description = "Research environment for backtesting a systematic daily-swing trading bot"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "alpaca-py>=0.30",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "hmmlearn>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.400",
    "pandas-stubs>=2.2",
]
dashboard = [
    "streamlit>=1.40",
    "matplotlib>=3.8",
]

[project.scripts]
quant-lab = "quantlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
